name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - mix.exs
      - mix.lock
      - config/**
      - lib/**
      - .github/workflows/docker.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: paper_tiger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only worth publishing if a real Stripe SDK can drive it, so
      # the smoke test exercises the round trip that stripe-mock cannot do:
      # create a resource, then read it back.
      - name: Smoke test
        run: |
          docker run -d --name pt -p 12111:12111 paper_tiger:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:12111/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:12111/health

          id=$(curl -fsS -X POST http://localhost:12111/v1/customers \
                 -u sk_test_ci: -d "email=ci@example.com" \
               | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "created $id"

          curl -fsS "http://localhost:12111/v1/customers/$id" -u sk_test_ci: \
            | python3 -c "import json,sys; assert json.load(sys.stdin)['id'] == '$id'"
          echo "round trip ok"

          curl -fsS -X POST http://localhost:12111/_config/time/advance \
            -u sk_test_ci: -d "days=30"

          docker rm -f pt

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is where people browse this category; GHCR has no search or
      # browse surface worth the name. Mirroring is gated on the secret so the
      # workflow stays green if the credentials are ever absent or rotated out.
      - name: Check for Docker Hub credentials
        if: github.event_name == 'push'
        id: dockerhub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Multiline outputs require a heredoc delimiter; a bare newline in the
          # value silently corrupts the parse.
          if [ -n "$TOKEN" ] && [ -n "$USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            {
              echo "images<<IMAGES_EOF"
              echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
              echo "docker.io/${USERNAME}/paper_tiger"
              echo "IMAGES_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "images<<IMAGES_EOF"
              echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
              echo "IMAGES_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; publishing to GHCR only."
          fi

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dockerhub.outputs.images }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Docker Hub page is the actual discovery surface: it is what someone
      # sees when they search "stripe" there. Keep it in step with the README
      # rather than letting it rot at whatever the first push happened to say.
      - name: Sync Docker Hub description
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dockerhub.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/paper_tiger
          short-description: "A stateful mock Stripe server for testing. Point any Stripe SDK at it."
          readme-filepath: ./README.md
